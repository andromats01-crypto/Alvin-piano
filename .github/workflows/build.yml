name: Build Alvin Piano APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Alvin Piano - Step 1
        run: |
          mkdir -p app/build/outputs/apk/debug
          echo "Alvin Piano Davao - Step 1 OK" > app/build/outputs/apk/debug/README.txt
          echo "APK placeholder" > app/build/outputs/apk/debug/Alvin-Piano.apk
          ls -lh app/build/outputs/apk/debug/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alvin-Piano-APK
          path: app/build/outputs/apk/debug/
