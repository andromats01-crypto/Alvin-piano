name: Build Alvin Piano Real APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build Real APK
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/alvin/piano app/src/main/res/layout app/src/main/res/values
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          printf 'buildscript{repositories{google();mavenCentral()}dependencies{classpath "com.android.tools.build:gradle:8.1.2"}}allprojects{repositories{google();mavenCentral();maven{url "https://jitpack.io"}}}\n' > build.gradle
          printf 'plugins{id "com.android.application"}\nandroid{namespace "com.alvin.piano";compileSdk 33;defaultConfig{applicationId "com.alvin.piano";minSdk 21;targetSdk 33;versionCode 13;versionName "5LayerReal"}}\ndependencies{implementation "androidx.appcompat:appcompat:1.6.1";implementation "com.github.billthefarmer:mididriver:v1.16"}\n' > app/build.gradle
          python3 -c "
          m='\x3c?xml version=\"1.0\" encoding=\"utf-8\"?\x3e\x3cmanifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\x3e\x3capplication android:label=\"Alvin Piano\" android:theme=\"@android:style/Theme.NoTitleBar\"\x3e\x3cactivity android:name=\".MainActivity\" android:exported=\"true\"\x3e\x3cintent-filter\x3e\x3caction android:name=\"android.intent.action.MAIN\"/\x3e\x3ccategory android:name=\"android.intent.category.LAUNCHER\"/\x3e\x3c/intent-filter\x3e\x3c/activity\x3e\x3c/application\x3e\x3c/manifest\x3e'
          open('app/src/main/AndroidManifest.xml','w').write(m)
          s='\x3cresources\x3e\x3cstring name=\"app_name\"\x3eAlvin Piano\x3c/string\x3e\x3cstring-array name=\"instruments\"\x3e\x3citem\x3ePiano\x3c/item\x3e\x3citem\x3eStrings\x3c/item\x3e\x3citem\x3ePad\x3c/item\x3e\x3citem\x3eChoir\x3c/item\x3e\x3citem\x3eBass\x3c/item\x3e\x3c/string-array\x3e\x3c/resources\x3e'
          open('app/src/main/res/values/strings.xml','w').write(s)
          l='\x3c?xml version=\"1.0\" encoding=\"utf-8\"?\x3e\x3cLinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\" android:orientation=\"vertical\" android:layout_width=\"match_parent\" android:layout_height=\"match_parent\" android:background=\"#0F172A\" android:padding=\"10dp\"\x3e\x3cTextView android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\" android:text=\"ALVIN PIANO - 5 LAYER REAL\" android:textColor=\"#FFD700\" android:gravity=\"center\" android:textStyle=\"bold\"/\x3e\x3cSpinner android:id=\"@+id/spin1\" android:layout_width=\"match_parent\" android:layout_height=\"40dp\" android:background=\"#1E293B\"/\x3e\x3cSeekBar android:id=\"@+id/vol1\" android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\" android:max=\"100\" android:progress=\"100\"/\x3e\x3cSpinner android:id=\"@+id/spin2\" android:layout_width=\"match_parent\" android:layout_height=\"40dp\" android:background=\"#1E293B\"/\x3e\x3cSeekBar android:id=\"@+id/vol2\" android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\" android:max=\"100\" android:progress=\"80\"/\x3e\x3cSpinner android:id=\"@+id/spin3\" android:layout_width=\"match_parent\" android:layout_height=\"40dp\" android:background=\"#1E293B\"/\x3e\x3cSeekBar android:id=\"@+id/vol3\" android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\" android:max=\"100\" android:progress=\"70\"/\x3e\x3cSpinner android:id=\"@+id/spin4\" android:layout_width=\"match_parent\" android:layout_height=\"40dp\" android:background=\"#1E293B\"/\x3e\x3cSeekBar android:id=\"@+id/vol4\" android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\" android:max=\"100\" android:progress=\"60\"/\x3e\x3cSpinner android:id=\"@+id/spin5\" android:layout_width=\"match_parent\" android:layout_height=\"40dp\" android:background=\"#1E293B\"/\x3e\x3cSeekBar android:id=\"@+id/vol5\" android:layout_width=\"match_parent\" android:layout_height=\"wrap_content\" android:max=\"100\" android:progress=\"50\"/\x3e\x3cLinearLayout android:orientation=\"horizontal\" android:layout_width=\"match_parent\" android:layout_height=\"80dp\"\x3e\x3cButton android:id=\"@+id/btn_c\" android:layout_width=\"0dp\" android:layout_height=\"match_parent\" android:layout_weight=\"1\" android:text=\"C\"/\x3e\x3cButton android:id=\"@+id/btn_d\" android:layout_width=\"0dp\" android:layout_height=\"match_parent\" android:layout_weight=\"1\" android:text=\"D\"/\x3e\x3cButton android:id=\"@+id/btn_e\" android:layout_width=\"0dp\" android:layout_height=\"match_parent\" android:layout_weight=\"1\" android:text=\"E\"/\x3e\x3cButton android:id=\"@+id/btn_f\" android:layout_width=\"0dp\" android:layout_height=\"match_parent\" android:layout_weight=\"1\" android:text=\"F\"/\x3e\x3cButton android:id=\"@+id/btn_g\" android:layout_width=\"0dp\" android:layout_height=\"match_parent\" android:layout_weight=\"1\" android:text=\"G\"/\x3e\x3c/LinearLayout\x3e\x3c/LinearLayout\x3e'
          open('app/src/main/res/layout/activity_main.xml','w').write(l)
          j='package com.alvin.piano;import android.os.Bundle;import android.widget.ArrayAdapter;import android.widget.SeekBar;import android.widget.Spinner;import androidx.appcompat.app.AppCompatActivity;import org.billthefarmer.mididriver.MidiDriver;public class MainActivity extends AppCompatActivity implements MidiDriver.OnMidiStartListener{private MidiDriver midi;private int[] vols={100,80,70,60,50};@Override protected void onCreate(Bundle b){super.onCreate(b);setContentView(R.layout.activity_main);midi=MidiDriver.getInstance();midi.setOnMidiStartListener(this);Spinner[] sp=new Spinner[5];sp[0]=findViewById(R.id.spin1);sp[1]=findViewById(R.id.spin2);sp[2]=findViewById(R.id.spin3);sp[3]=findViewById(R.id.spin4);sp[4]=findViewById(R.id.spin5);ArrayAdapter ad=ArrayAdapter.createFromResource(this,R.array.instruments,android.R.layout.simple_spinner_item);ad.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);for(int i=0;i<5;i++)sp[i].setAdapter(ad);findViewById(R.id.btn_c).setOnClickListener(v->play(60));findViewById(R.id.btn_d).setOnClickListener(v->play(62));findViewById(R.id.btn_e).setOnClickListener(v->play(64));findViewById(R.id.btn_f).setOnClickListener(v->play(65));findViewById(R.id.btn_g).setOnClickListener(v->play(67));}void play(int note){for(int ly=0;ly<5;ly++){if(vols[ly]==0)continue;byte[] pc=new byte[]{(byte)(0xC0+ly),(byte)(ly*8)};midi.write(pc);byte[] on=new byte[]{(byte)(0x90+ly),(byte)note,(byte)vols[ly]};midi.write(on);byte[] off=new byte[]{(byte)(0x80+ly),(byte)note,(byte)0};midi.getHandler().postDelayed(()->midi.write(off),800);}}public void onMidiStart(){}protected void onResume(){super.onResume();midi.start();}protected void onPause(){super.onPause();midi.stop();}}'
          open('app/src/main/java/com/alvin/piano/MainActivity.java','w').write(j)
          "
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
         ./gradle-8.0/bin/gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Alvin-Piano-REAL-5Layer
          path: app/build/outputs/apk/debug/*.apk
