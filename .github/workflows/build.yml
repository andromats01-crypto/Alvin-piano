name: Build Alvin Piano APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Alvin Piano App Files
        run: |
          mkdir -p app/src/main/java/com/alvin/piano
          mkdir -p app/build/outputs/apk/debug
          echo "include ':app'" > settings.gradle
          echo "Alvin Piano Davao Worship - Built $(date)" > README.md
          echo "This is your Alvin Piano APK placeholder - real piano build next!" > app/build/outputs/apk/debug/README.txt
          # Create a fake APK file for now so you can download
          echo "ALVIN PIANO APK" > app/build/outputs/apk/debug/Alvin-Piano-Davao.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alvin-Piano-APK
          path: app/build/outputs/apk/debug/
