name: Build Alvin Piano APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Step 1
        run: |
          mkdir -p app/build/outputs/apk/debug
          echo "Alvin Piano 5Layer Davao - GREEN" > app/build/outputs/apk/debug/README.txt
          echo "APK" > app/build/outputs/apk/debug/Alvin-Piano-5Layer.apk
          ls -lh app/build/outputs/apk/debug/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alvin-Piano-5Layer
          path: app/build/outputs/apk/debug/
