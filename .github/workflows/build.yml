name: Build Alvin Piano APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build Real Piano
        run: |
          mkdir -p app/src/main/java/com/alvin/piano app/src/main/res/layout
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.alvin.piano'; compileSdk 34; defaultConfig { applicationId "com.alvin.piano"; minSdk 21; targetSdk 34; versionCode 3; versionName "3.0" } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Alvin Piano"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F172A"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="ALVIN PIANO - Davao Worship" android:textColor="#FFF" android:textSize="20sp" android:gravity="center" android:padding="16dp"/><LinearLayout android:orientation="horizontal" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"><Button android:id="@+id/c" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="C"/><Button android:id="@+id/d" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="D"/><Button android:id="@+id/e" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="E"/><Button android:id="@+id/f" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="F"/><Button android:id="@+id/g" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="G"/><Button android:id="@+id/a" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="A"/><Button android:id="@+id/b" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="B"/></LinearLayout></LinearLayout>
          EOF
          cat > app/src/main/java/com/alvin/piano/MainActivity.kt << 'EOF'
          package com.alvin.piano
          import android.media.AudioManager; import android.media.ToneGenerator; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; import android.widget.Button
          class MainActivity : AppCompatActivity() { private val toneGen = ToneGenerator(AudioManager.STREAM_MUSIC, 100); override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContentView(R.layout.activity_main); findViewById<Button>(R.id.c).setOnClickListener { toneGen.startTone(ToneGenerator.TONE_DTMF_0, 300) }; findViewById<Button>(R.id.d).setOnClickListener { toneGen.startTone(ToneGenerator.TONE_DTMF_1, 300) }; findViewById<Button>(R.id.e).setOnClickListener { toneGen.startTone(ToneGenerator.TONE_DTMF_2, 300) }; findViewById<Button>(R.id.f).setOnClickListener { toneGen.startTone(ToneGenerator.TONE_DTMF_3, 300) }; findViewById<Button>(R.id.g).setOnClickListener { toneGen.startTone(ToneGenerator.TONE_DTMF_4, 300) }; findViewById<Button>(R.id.a).setOnClickListener { toneGen.startTone(ToneGenerator.TONE_DTMF_5, 300) }; findViewById<Button>(R.id.b).setOnClickListener { toneGen.startTone(ToneGenerator.TONE_DTMF_6, 300) } } }
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip; unzip -q gradle-8.5-bin.zip;./gradle-8.5/bin/gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Alvin-Piano-Real-APK
          path: app/build/outputs/apk/debug/*.apk
