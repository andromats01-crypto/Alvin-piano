name: Build Alvin Piano Real APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build Real
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/alvin/piano app/src/main/res/layout app/src/main/res/values
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          echo "buildscript{repositories{google();mavenCentral()}dependencies{classpath 'com.android.tools.build:gradle:8.1.2'}}allprojects{repositories{google();mavenCentral();maven{url 'https://jitpack.io'}}}" > build.gradle
          echo "plugins{id 'com.android.application'} android{namespace 'com.alvin.piano';compileSdk 33;defaultConfig{applicationId 'com.alvin.piano';minSdk 21;targetSdk 33;versionCode 13;versionName '5LayerReal'}} dependencies{implementation 'androidx.appcompat:appcompat:1.6.1';implementation 'com.github.billthefarmer:mididriver:v1.16'}" > app/build.gradle
          python3 build.py
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
         ./gradle-8.0/bin/gradle assembleDebug
          ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: Alvin-Piano-REAL-5Layer
          path: app/build/outputs/apk/debug/*.apk
